name: Android build

# Builds the APK and publishes it as `nomad.apk` on the matching GitHub release,
# so the website's "download apk" / in-app updater link (releases/latest/download/
# nomad.apk) always resolves to a fresh build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8 requires Node >= 22
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build web (root base for Capacitor)
        run: npm run build:android

      - name: Copy web assets into the Android project
        run: npx cap copy android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publish nomad.apk to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=""
          fi
          # The desktop workflow creates the release; wait for it (tag builds),
          # or fall back to the newest release on manual runs.
          for _ in $(seq 1 45); do
            if [[ -n "$TAG" ]]; then
              gh release view "$TAG" > /dev/null 2>&1 && break
            else
              LATEST=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
              if [[ -n "$LATEST" ]]; then TAG="$LATEST"; break; fi
            fi
            sleep 20
          done
          echo "uploading nomad.apk to release: $TAG"
          gh release upload "$TAG" android/app/build/outputs/apk/debug/app-debug.apk#nomad.apk --clobber
